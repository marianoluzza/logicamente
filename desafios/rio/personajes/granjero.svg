<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Máscara de recorte un poquito más chica para no asomar por debajo del borde -->
    <clipPath id="circleClip">
      <circle cx="50" cy="50" r="46.5" />
    </clipPath>
  </defs>

  <!-- 1. Fondo Base (Solo el color de fondo, sin el borde) -->
  <circle cx="50" cy="50" r="48" fill="#FFF3E0" />

  <!-- 2. Personaje (Todo dentro se recorta perfectamente) -->
  <g clip-path="url(#circleClip)">
    <!-- Overol -->
    <path d="M 30 85 L 30 105 L 70 105 L 70 85 C 70 70 30 70 30 85 Z" fill="#1E88E5"/>
    <path d="M 40 68 L 40 85 M 60 68 L 60 85" stroke="#1565C0" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="50" cy="78" rx="12" ry="10" fill="#E0E0E0"/>

    <!-- Cabeza -->
    <circle cx="50" cy="48" r="20" fill="#FFCC80"/>

    <!-- Barba -->
    <path d="M 32 48 C 32 66 68 66 68 48 C 68 58 32 58 32 48 Z" fill="#8D6E63"/>

    <!-- Ojos y Sonrisa -->
    <circle cx="43" cy="44" r="2.5" fill="#3E2723"/>
    <circle cx="57" cy="44" r="2.5" fill="#3E2723"/>
    <path d="M 46 54 Q 50 58 54 54" stroke="#3E2723" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Sombrero de Paja -->
    <path d="M 20 40 Q 50 28 80 40 L 75 42 Q 50 32 25 42 Z" fill="#FBC02D"/>
    <path d="M 32 38 C 32 20 68 20 68 38 Z" fill="#FBC02D"/>
    <path d="M 32 38 Q 50 36 68 38" stroke="#D32F2F" stroke-width="3" fill="none"/>
  </g>

  <!-- 3. Borde Base (Dibujado al final para tapar cualquier imperfección del recorte) -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#FFB74D" stroke-width="3"/>
</svg>
