<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1b1730" />
  <meta name="description" content="Apagá todas las luces del tablero: cada toque cambia la luz elegida y sus vecinas." />
  <title>Luces fuera — Lógicamente</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../assets/base.css" />
  <link rel="stylesheet" href="../../assets/game.css" />
  <link rel="stylesheet" href="luces.css" />
</head>
<body>
  <main class="shell">
    <header>
      <a class="brand" href="../../" aria-label="Volver a Lógicamente"><span class="brand-mark">L</span>Lógicamente</a>
      <span class="progress">Desafío 05</span>
    </header>

    <section class="game" aria-labelledby="game-title">
      <a class="back" href="../../">← Volver a desafíos</a>

      <div class="game-top">
        <div>
          <div class="eyebrow">Desafío 05</div>
          <h1 id="game-title">Luces fuera</h1>
          <p class="rules">Cada toque prende o apaga la luz elegida y sus vecinas de arriba, abajo y los costados. Apagalas todas.</p>
        </div>
        <div class="counter" id="count" aria-live="polite"></div>
      </div>

      <div class="levels" role="group" aria-label="Nivel">
        <button class="level" type="button" data-level="0">3×3</button>
        <button class="level" type="button" data-level="1">4×4</button>
        <button class="level" type="button" data-level="2">5×5</button>
      </div>

      <div class="lights-board" id="board" aria-label="Tablero"></div>

      <p class="feedback" id="feedback" aria-live="polite"></p>

      <div class="actions">
        <button class="reset" type="button" id="reset">Reiniciar</button>
        <button class="reset" type="button" id="another">Otro tablero</button>
        <button class="reset primary" type="button" id="next" hidden>Siguiente nivel →</button>
        <span class="tip" id="tip"></span>
      </div>
    </section>
  </main>
  <script src="luces.js"></script>
</body>
</html>
